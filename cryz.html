  <script>(function(){try{var p=JSON.parse(localStorage.getItem('cryz-prefs'))||{};var e=document.documentElement;e.setAttribute('data-theme',p.theme||'system');e.setAttribute('data-accent',p.accent||'pink');if(p.mono)e.classList.add('cryz-mono');if(p.field)e.classList.add('cryz-field');if(p.tilt===false)e.classList.add('cryz-no-tilt');if(p.heroBg!==true)e.classList.add('cryz-no-hero-bg');if(p.heroIcons!==true)e.classList.add('cryz-no-hero-icons');}catch(_){}})();</script>
  <meta charset="utf-8">

  <meta name="color-scheme" content="light dark">
  <title>cryz — Javier Alonso</title>
  <meta name="description" content="The harlequin corner.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="themes/skin.js"></script>
  <style>
    .harlequin {
      position: fixed;
      inset: -20%;
      z-index: -1;
      background: conic-gradient(from 90deg at 50% 50%, var(--text) 25%, transparent 0 50%, var(--text) 0 75%, transparent 0);
      background-size: 84px 84px;
      transform: rotate(45deg);
      opacity: 0.05;
      animation: drift 24s linear infinite;
    }

    @keyframes drift {
      to { background-position: 84px 168px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .harlequin { animation: none; }
    }

    .cryz-hero {
      min-height: calc(100vh - 220px);
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
    }

    .cryz-word {
      font-size: clamp(72px, 18vw, 200px);
      font-weight: 600;
      letter-spacing: -6px;
      margin: 0;
      background: linear-gradient(120deg, var(--text) 0 30%, var(--link) 30% 45%, var(--text) 45% 70%, var(--link) 70% 85%, var(--text) 85%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 6s linear infinite;
    }

    @keyframes sheen {
      to { background-position: -220% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cryz-word { animation: none; }
    }

    .cryz-sub {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 18px;
    }

    .cryz-diamond {
      position: absolute;
      width: 22px;
      height: 22px;
      background: var(--link);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      opacity: 0.8;
      animation: bob 3.4s ease-in-out infinite;
    }

    .cryz-diamond.d1 { top: 18%; left: 14%; }
    .cryz-diamond.d2 { top: 64%; right: 12%; width: 30px; height: 30px; animation-delay: 0.7s; }
    .cryz-diamond.d3 { bottom: 12%; left: 32%; width: 14px; height: 14px; animation-delay: 1.4s; background: var(--text); }

    @keyframes bob {
      50% { transform: translateY(-14px) rotate(90deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cryz-diamond { animation: none; }
    }
  </style>
</head>
<body>

  <header class="top">
    <div class="wrap top-inner">
      <a class="wordmark" href="./" aria-label="Back to home">
        Javier Alonso
      </a>
      <nav aria-label="Primary">

          <li><a href="playground/">Playground</a></li>

          <li><a class="cryz" href="cryz.html" aria-current="page" aria-label="theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="c2" cx="13.5" cy="6.5" r=".5"/><circle class="c2" cx="17.5" cy="10.5" r=".5"/><circle class="c2" cx="8.5" cy="7.5" r=".5"/><circle class="c2" cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.436-.652-.436-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>theme</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="detail">
    <div class="wrap cryz-hero">
      <span class="harlequin" aria-hidden="true"></span>
      <span class="cryz-diamond d1" aria-hidden="true"></span>
      <span class="cryz-diamond d2" aria-hidden="true"></span>
      <span class="cryz-diamond d3" aria-hidden="true"></span>
      <div>
        <h1 class="cryz-word">cryz</h1>
        <p class="cryz-sub">harlequin mode · everything here is a prototype, including this</p>
        <p style="margin-top:34px"><a class="pill pill-dark" href="./">Back to the paper <span class="arrow" aria-hidden="true">→</span></a></p>
      </div>
    </div>
  </main>

  <script src="cryz.js" defer></script>
