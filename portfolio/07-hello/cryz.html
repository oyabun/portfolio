  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>cryz — Javier Alonso</title>
  <meta name="description" content="The harlequin corner.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .harlequin {
      position: fixed;
      inset: -20%;
      z-index: -1;
      background: conic-gradient(from 90deg at 50% 50%, var(--text) 25%, transparent 0 50%, var(--text) 0 75%, transparent 0);
      background-size: 84px 84px;
      transform: rotate(45deg);
      opacity: 0.05;
      animation: drift 24s linear infinite;
    }

    @keyframes drift {
      to { background-position: 84px 168px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .harlequin { animation: none; }
    }

    .cryz-hero {
      min-height: calc(100vh - 220px);
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
    }

    .cryz-word {
      font-size: clamp(72px, 18vw, 200px);
      font-weight: 600;
      letter-spacing: -6px;
      margin: 0;
      background: linear-gradient(120deg, var(--text) 0 30%, var(--link) 30% 45%, var(--text) 45% 70%, var(--link) 70% 85%, var(--text) 85%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 6s linear infinite;
    }

    @keyframes sheen {
      to { background-position: -220% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cryz-word { animation: none; }
    }

    .cryz-sub {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 18px;
    }

    .cryz-diamond {
      position: absolute;
      width: 22px;
      height: 22px;
      background: var(--link);
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      opacity: 0.8;
      animation: bob 3.4s ease-in-out infinite;
    }

    .cryz-diamond.d1 { top: 18%; left: 14%; }
    .cryz-diamond.d2 { top: 64%; right: 12%; width: 30px; height: 30px; animation-delay: 0.7s; }
    .cryz-diamond.d3 { bottom: 12%; left: 32%; width: 14px; height: 14px; animation-delay: 1.4s; background: var(--text); }

    @keyframes bob {
      50% { transform: translateY(-14px) rotate(90deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cryz-diamond { animation: none; }
    }
  </style>
</head>

      <span class="harlequin" aria-hidden="true"></span>

      <span class="cryz-diamond d2" aria-hidden="true"></span>
