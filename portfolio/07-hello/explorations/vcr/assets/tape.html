<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCR: the tape, drawn</title>
<!-- Caveat, for the label. A cassette inlay is printed once and then filled in
     by hand, so the fields are set in a sans and what a person would write is
     handwritten. Loaded here rather than inherited: this is its own document. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* A conveyor of cassettes, each one drawn rather than rendered: the geometry is
   real and lit by nothing, and only its edges are kept. That is what a
   blueprint is — the object described by where its surfaces end.
   Embedded by index.html as the hero; standalone it is the same drawing on
   its own sheet, which makes it something you can open and check. */
/* The drawing, and nothing else. No background: the canvas is transparent and
   the object sits directly on the hero's paper, so the page's own rules pass
   behind it instead of being interrupted by a dark panel.

   The fill faces are still painted — that is what hides the geometry behind
   each part — but they are painted in the *page's* paper colour, which is why
   --paper here has to be the same value as the host's. */
:root{
  --paper:#F7F5F3;
  --ink:#141312;
  --fine:#8D8880;
  --rule:#E4E0DB;
  --accent:#50CDA7;
  --accent-ink:#0B2A22;
  --accent-wash:rgba(80,205,167,.18);
  --gut:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:transparent}
canvas{position:relative;z-index:1;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.dragging{cursor:grabbing}

/* The controls, in the host page's register: a filled pill for the thing that
   moves and hairline pills for the rest. Restated rather than imported — this
   is a separate document and one shared stylesheet for two buttons would be a
   file to keep in step. */
/* The stream. Paper and hairlines like everything else here — the deck draws
   this panel dark on its own sheet, but on the landing a black rectangle in
   the corner would be the loudest thing on the page. It sits behind the
   canvas, so the tape passes in front of it, and its box is snapped to the
   host page's own 64px grid (placeStreamBox, below) rather than left at a
   guessed percentage, so the panel one hairline plane reads as ruled on the
   same sheet as the paper behind it instead of floating at an offset of its
   own. */
.stream{position:absolute;z-index:0;
  display:flex;flex-direction:column;border:1px solid var(--rule);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s;pointer-events:none}
body.streaming .stream{opacity:1;transform:none}
/* Ruled off, not filled. A tinted bar in the corner of a page made of
   hairlines is the one loud thing on it. */
.stream header{display:flex;align-items:center;gap:8px;padding:6px 10px;
  border-bottom:1px solid var(--rule);
  font-size:8.5px;letter-spacing:.16em;text-transform:uppercase}
.stream header b{font-weight:700;color:var(--ink)}
.stream header em{margin-left:auto;font-style:normal;color:var(--fine);letter-spacing:.1em}
.stream header i{width:6px;height:6px;border-radius:50%;border:1px solid var(--ink);flex:none}
body.streaming .stream header i{background:var(--accent);border-color:var(--accent);
  animation:pulse .9s steps(2,end) infinite}
@keyframes pulse{50%{opacity:.25}}
/* A column, so the file runs down the right of the frame and the tape passes
   in front of it. Lines are not wrapped — a wrapped .jsonl record stops looking
   like a record — so they run off the right edge under a mask, which is what a
   stream going past should look like. */
/* The failures, in the one other colour this sheet allows itself. Not the
   deck's own --t-error #D95926: that value is mixed for a dark panel and comes
   out at 3.6:1 on paper, which fails for 10.5px of mono. Same hue, taken deep
   enough to read — 5.4:1. Weight is left alone; bold 10.5px mono in a column of
   regular is a bar, not a line of a file. */
.stream pre b{font-weight:400;color:#B23C1E}
.stream pre{flex:1;margin:0;padding:9px 10px 0;overflow:hidden;white-space:pre;
  font-size:10.5px;line-height:1.62;color:color-mix(in srgb,var(--fine) 60%,var(--ink) 40%);
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 16%,#000 88%,transparent),
    linear-gradient(to right,#000 76%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to bottom,transparent,#000 16%,#000 88%,transparent),
    linear-gradient(to right,#000 76%,transparent);
  mask-composite:intersect}
@media(prefers-reduced-motion:reduce){.stream,body.streaming .stream header i{transition:none;animation:none}}

/* The deck's own transport used to be drawn here, centred under the canvas.
   It now lives in the host page, beside "Use the CLI" — a real DOM element
   next to a real link reads as one row of controls, where a row inside this
   iframe never could sit flush beside anything outside it. This document
   still runs the whole state machine (below); it only takes its orders by
   postMessage now instead of from a button in its own body. */
</style>
</head>
<body>
<!-- Behind the canvas, bottom right: the file the machine is reading. It is
     under the drawing rather than over it because the tape is the subject and
     this is what the tape contains. -->
<section class="stream" aria-live="off">
  <header><i></i><b>Live .jsonl</b><em data-clock>00:00:00.0</em></header>
  <pre data-lines></pre>
</section>
<canvas id="c"></canvas>

<script src="../vendor/three.min.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  if (params.get('embed')) document.body.classList.add('embed');
  if (params.get('skin') === 'blueprint') document.body.classList.add('blueprint');

  const canvas = document.getElementById('c');
  const scene = new THREE.Scene();
  // No scene background at all: the canvas is cleared to transparent so the
  // hero's paper shows through and the page's rules run behind the object.
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setClearAlpha(0);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // Orthographic, because an axonometric drawing has no vanishing point. It is
  // declared here, above the assembly, because the assembly needs it while it
  // is being built: addPrismContours picks which two side lines to draw on each
  // extruded part by testing the shape against the camera's right vector, so a
  // camera declared after the build is a camera that does not exist yet.
  //
  // The position is the drafting sheet's own station point, kept so the object
  // sits at the attitude it has there: high, off the left shoulder.
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 200);
  camera.position.set(8.6, 10.2, 12.5);
  camera.lookAt(0, 0, 0);

  // ---- the tape, as the technical sheet draws it ----------------------------
  //
  // Ported from tapes__1_.html's drafting assembly rather than its studio
  // model: every part carries a fill face painted in the sheet colour, which
  // hides the geometry behind it, and an edge pass over the top supplies the
  // linework. That is the whole trick, and it is why the background and the
  // fill must be the same colour.
  //
  // Dropped in the port: the shaded layer, its lights and its shadow catcher.
  // They exist on that sheet to wipe between drawn and rendered halves; this
  // hero only ever shows the drawing. RoundedBoxGeometry is an addon and the
  // vendored build has none, so the reel spokes use an extruded rounded box.

  // The sheet's ink and paper. The fill faces are painted in TECH_BG to hide
  // what is behind them, so the scene background has to be the same colour or
  // every part of the drawing reads as a hole cut in the page.
  // Paper and ink are the host page's, not the drafting sheet's: this drawing
  // is on the landing, in the landing's colours.
  const TECH_BG = 0xF7F5F3, TECH_INK = 0x141312;
const TECH_THEMES={
  technical:{bg:0x4b4b49,ink:0xf1f0e9,fine:0xa9a8a3,dash:0xa3a29e,paper:'#4b4b49',rule:'#a9a8a3',type:'#f1f0e9'}
};
let technicalTheme='technical';

function roundedShape(w,h,r){const x=-w/2,y=-h/2,s=new THREE.Shape();r=Math.min(r,w/2,h/2);s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);s.closePath();return s}
function roundedPath(w,h,r,xo=0,yo=0){const x=xo-w/2,y=yo-h/2,p=new THREE.Path();r=Math.min(r,w/2,h/2);p.moveTo(x+r,y);p.lineTo(x+w-r,y);p.quadraticCurveTo(x+w,y,x+w,y+r);p.lineTo(x+w,y+h-r);p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);p.lineTo(x+r,y+h);p.quadraticCurveTo(x,y+h,x,y+h-r);p.lineTo(x,y+r);p.quadraticCurveTo(x,y,x+r,y);p.closePath();return p}

  function RoundedBoxGeometry(w, h, d, seg, r) {
    const g = new THREE.ExtrudeGeometry(roundedShape(w, h, r), { depth: d,
      bevelEnabled: true, bevelSize: r * .5, bevelThickness: r * .5,
      bevelSegments: 3, curveSegments: 6 });
    g.center();
    return g;
  }

const technicalAssembly=new THREE.Group();scene.add(technicalAssembly);
const technicalFillMaterial=new THREE.MeshBasicMaterial({color:TECH_BG,side:THREE.DoubleSide,depthTest:true,depthWrite:true,polygonOffset:true,polygonOffsetFactor:4,polygonOffsetUnits:4,toneMapped:false});
const technicalLineMaterial=new THREE.LineBasicMaterial({color:TECH_INK,depthTest:true,depthFunc:THREE.LessEqualDepth,depthWrite:false,toneMapped:false});
const technicalFineMaterial=new THREE.LineBasicMaterial({color:0xa9a8a3,depthTest:true,depthFunc:THREE.LessEqualDepth,depthWrite:false,toneMapped:false});
const technicalDashMaterial=new THREE.LineDashedMaterial({color:0xa3a29e,dashSize:.12,gapSize:.10,depthTest:true,depthFunc:THREE.LessEqualDepth,depthWrite:false,toneMapped:false});
const technicalGuides=[],technicalScrews=[],technicalReels=[],technicalContourConnectors=[];
// The host posts its resolved palette whenever the reader picks a theme (and
// once on load, in reply to the 'hello' below). The fill faces have to move
// with --paper exactly as the comment above them says, or the theme picker
// repaints the sheet around a cassette that is still drawn in "lines".
function applyHeroTheme(t){
  if(t.paper) technicalFillMaterial.color.set(t.paper);
  if(t.ink) technicalLineMaterial.color.set(t.ink);
  if(t.fine){ technicalFineMaterial.color.set(t.fine); technicalDashMaterial.color.set(t.fine); }
  // The label is a texture, not a material: repainting the three materials
  // above leaves it exactly as drawn, which is the one part of the drawing a
  // theme switch used to skip. Its own "rule" is the fine ink, not the page's
  // hairline --rule — that is what the default THEME below already used it for.
  if(t.paper && t.ink && t.fine) drawTechnicalLabel({ paper:t.paper, rule:t.fine, type:t.ink });
  const root = document.documentElement.style;
  if(t.paper) root.setProperty('--paper', t.paper);
  if(t.ink) root.setProperty('--ink', t.ink);
  if(t.fine) root.setProperty('--fine', t.fine);
  if(t.rule) root.setProperty('--rule', t.rule);
  if(t.accent) root.setProperty('--accent', t.accent);
  if(t.accentInk) root.setProperty('--accent-ink', t.accentInk);
  if(t.accentWash) root.setProperty('--accent-wash', t.accentWash);
}
// the rendered half drops a shadow on the sheet; the drawn half never sees it


function draftPart(geometry,position=[0,0,0],rotation=[0,0,0],fine=false,parent=technicalAssembly,edgeThreshold=13){
  const part=new THREE.Group();part.position.set(...position);part.rotation.set(...rotation);
  const fill=new THREE.Mesh(geometry,technicalFillMaterial);fill.renderOrder=1;part.add(fill);
  if(edgeThreshold!==null){const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geometry,edgeThreshold),fine?technicalFineMaterial:technicalLineMaterial);edges.renderOrder=2;edges.frustumCulled=false;part.add(edges)}
  parent.add(part);return part;
}
function roundedDraft(w,h,d,r,position,rotation=[0,0,0],fine=false,parent=technicalAssembly){return draftPart(new RoundedBoxGeometry(w,h,d,4,r),position,rotation,fine,parent)}
function cylinderDraft(radius,height,position,segments=32,fine=false,parent=technicalAssembly){return draftPart(new THREE.CylinderGeometry(radius,radius,height,segments,1,false),position,[0,0,0],fine,parent)}
function addGuide(from,to){const geometry=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...from),new THREE.Vector3(...to)]);const line=new THREE.Line(geometry,technicalDashMaterial);line.computeLineDistances();technicalAssembly.add(line);technicalGuides.push(line);return line}
function extrudedShapeGeometry(shape,height){const geometry=new THREE.ExtrudeGeometry(shape,{depth:height,steps:1,bevelEnabled:false,curveSegments:24});geometry.center();return geometry}
function contourPoints(path){const points=path.getPoints(32);if(points.length>1&&points[0].distanceToSquared(points.at(-1))<1e-10)points.pop();return points}
function addPrismContours(part,paths,height,material=technicalLineMaterial){
  const right=new THREE.Vector2(camera.position.z,-camera.position.x).normalize();
  for(const path of paths){
    const points=contourPoints(path);
    for(const depth of [-height/2,height/2]){const geometry=new THREE.BufferGeometry().setFromPoints(points.map(point=>new THREE.Vector3(point.x,point.y,depth)));const loop=new THREE.LineLoop(geometry,material);loop.renderOrder=3;loop.frustumCulled=false;part.add(loop)}
    let low=points[0],high=points[0],lowDot=Infinity,highDot=-Infinity;
    for(const point of points){const dot=point.dot(right);if(dot<lowDot){lowDot=dot;low=point}if(dot>highDot){highDot=dot;high=point}}
    const connectors=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(low.x,low.y,-height/2),new THREE.Vector3(low.x,low.y,height/2),new THREE.Vector3(high.x,high.y,-height/2),new THREE.Vector3(high.x,high.y,height/2)]);
    const sides=new THREE.LineSegments(connectors,material);sides.renderOrder=3;sides.frustumCulled=false;part.add(sides);technicalContourConnectors.push({part,sides,points,height});
  }
}
function updateTechnicalSilhouettes(){
  camera.updateMatrixWorld();technicalAssembly.updateMatrixWorld(true);const cameraRight=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion),partQuaternion=new THREE.Quaternion();
  for(const contour of technicalContourConnectors){contour.part.getWorldQuaternion(partQuaternion);const localRight=cameraRight.clone().applyQuaternion(partQuaternion.clone().invert()),right2D=new THREE.Vector2(localRight.x,localRight.y).normalize();let low=contour.points[0],high=contour.points[0],lowDot=Infinity,highDot=-Infinity;for(const point of contour.points){const dot=point.dot(right2D);if(dot<lowDot){lowDot=dot;low=point}if(dot>highDot){highDot=dot;high=point}}const position=contour.sides.geometry.attributes.position,half=contour.height/2;position.setXYZ(0,low.x,low.y,-half);position.setXYZ(1,low.x,low.y,half);position.setXYZ(2,high.x,high.y,-half);position.setXYZ(3,high.x,high.y,half);position.needsUpdate=true}
}

function horizontalFrame(w,d,height,windowW,windowD,y,windowX=0,windowZ=0){const outer=roundedShape(w,d,.16),hole=roundedPath(windowW,windowD,.13,windowX,windowZ);outer.holes.push(hole);const part=draftPart(extrudedShapeGeometry(outer,height),[0,y,0],[Math.PI/2,0,0],false,technicalAssembly,null);addPrismContours(part,[outer,hole],height);return part}
function horizontalPlate(w,d,height,r,y,x=0,z=0,fine=false){const shape=roundedShape(w,d,r),material=fine?technicalFineMaterial:technicalLineMaterial,part=draftPart(extrudedShapeGeometry(shape,height),[x,y,z],[Math.PI/2,0,0],fine,technicalAssembly,null);addPrismContours(part,[shape],height,material);return part}
function addScrew(x,z,top,bottom){const screw=cylinderDraft(.055,.28,[x,(top+bottom)/2,z],16,true);technicalScrews.push(screw);addGuide([x,top,z],[x,bottom,z]);return screw}
// What is written on the label. Rolled once per load rather than fixed: a demo
// tape that always says the same thing reads as a picture of a tape, and the
// one thing this label is for is showing that a tape carries whose session it
// was. The provider set is the page's own — the two it reads today and the one
// listed as coming — and the stock names are cassette stock names, which is the
// register the drawing is already in.
const TECH_PROVIDERS=[
  {provider:'Anthropic',model:'Claude Opus 4.8',mark:'claude'},
  {provider:'OpenAI',   model:'GPT-5',          mark:'openai'},
  {provider:'Google',   model:'Gemini 2.5 Pro', mark:'gemini'}
];
// The session's own name, built from two halves so a handful of words cover a
// hundred-odd tapes. Kept in two pools rather than one, because a verb that
// suits a problem does not suit a system: you fix a regression and you harden a
// container, and one shared list would have produced "speed up frontend
// regression" on a page whose whole claim is that it reads real sessions.
const TECH_NAMES=[
  {verbs:['Fix','Debug','Chase down','Track down'],
   things:['frontend regression','flaky test suite','memory leak','race condition',
           'CI timeout','token overrun','failing migration']},
  {verbs:['Improve','Harden','Refactor','Audit','Simplify','Speed up','Rework','Instrument'],
   things:['app performance','Docker container','K8s/Terraform infra layout',
           'auth middleware','CI pipeline','checkout flow','session parser',
           'token accounting','WebGL renderer','sandbox networking','cache layer']}
];
// The provider marks, on the same 24-unit grid the rest of the site draws them
// on, inlined for the same reason index.html inlines them: this sheet is one
// file. Only the three the label can show, not the whole set.
const TECH_MARKS={
  claude:'M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z',

  gemini:'M20.616 10.835a14.147 14.147 0 01-4.45-3.001 14.111 14.111 0 01-3.678-6.452.503.503 0 00-.975 0 14.134 14.134 0 01-3.679 6.452 14.155 14.155 0 01-4.45 3.001c-.65.28-1.318.505-2.002.678a.502.502 0 000 .975c.684.172 1.35.397 2.002.677a14.147 14.147 0 014.45 3.001 14.112 14.112 0 013.679 6.453.502.502 0 00.975 0c.172-.685.397-1.351.677-2.003a14.145 14.145 0 013.001-4.45 14.113 14.113 0 016.453-3.678.503.503 0 000-.975 13.245 13.245 0 01-2.003-.678z'

const techMarkCache={};
function drawTechnicalMark(context,key,x,y,size,colour){
  const d=TECH_MARKS[key];
  if(!d)return 0;
  if(!techMarkCache[key])techMarkCache[key]=new Path2D(d);
  context.save();
  context.translate(x,y);
  context.scale(size/24,size/24);
  context.fillStyle=colour;
  context.fill(techMarkCache[key]);
  context.restore();

    streamEl.innerHTML = stream.log.slice(Math.max(0, end - streamCap), end).map(i => {
      const rec = fakeJsonlRecords[i], line = esc(JSON.stringify(rec));
      return isErrorRecord(rec) ? `<b>${line}</b>` : line;
    }).join('\n');
  }
  function resetStream() {
    stream.cursor = -1; stream.head = 0; stream.dropped = 0; stream.log.length = 0;
    clockEl.textContent = '00:00:00.0';
    renderStream(true);
  }
  function tickStream(dt, running) {
    document.body.classList.toggle('streaming', running);
    if (!running) return;
    // Signed, because the shuttle has a direction and the file has to agree
    // with it. `T.shuttle ? 6 : 1` ran the file *forward* at six times speed
    // while the reels were spinning backwards: the clock climbed and fresh
    // records kept arriving on rewind, which is the one thing rewinding cannot
    // do. Six either way, and the clock cannot go below zero — that is the head
    // of the tape, not a negative timestamp.
    // Six either way, and signed: the shuttle has a direction and the file has
    // to agree with it. `T.shuttle ? 6 : 1` ran the file *forward* at six times
    // speed while the reels span backwards.
    const rate = T.shuttle ? 6 * T.shuttle : (T.playing ? 1 : 0);
    stream.head += dt * rate / GAP;

    // Forward, the head can run off the end of the log, and every line it
    // passes pulls the next record off the tape. Fast forward therefore fills
    // the panel six times quicker without a separate path for it: the rate is
    // in the head, and the records follow the head.
    const n = fakeJsonlRecords.length;
    while (stream.head > stream.dropped + stream.log.length) {
      stream.cursor = (stream.cursor + 1) % n;
      stream.log.push(stream.cursor);
      if (stream.log.length > HISTORY) { stream.log.shift(); stream.dropped++; }
    }
    // Back, it stops at the head of the tape — or at the oldest line still
    // held, once the log has started dropping its front, because winding to a
    // line that has been let go would show a panel with nothing in it.
    if (stream.head < stream.dropped) stream.head = stream.dropped;

    const tenths = Math.max(0, Math.floor(stream.head * GAP * 10));
    const pad = v => String(v).padStart(2, '0');
    clockEl.textContent = `${pad(Math.floor(tenths / 36000))}:${pad(Math.floor(tenths / 600) % 60)}` +
      `:${pad(Math.floor(tenths / 10) % 60)}.${tenths % 10}`;
    renderStream();
  }
  resetStream();

  // ---- turning it ------------------------------------------------------------
  //
  // Drag turns the object about its own centre. Pitch is clamped: past about
  // 35° either way an axonometric drawing stops reading as one.
  // Where the intro leaves the tape, and where it sits until a hand moves it.
  // Not square-on to the sheet: at yaw 0 the label's line of type runs down the
  // screen at 21 degrees and its face is only .56 toward the camera, which is a
  // label you tilt your head at. Turned .35 and tilted .35 the type comes within
  // 3 degrees of level and the face opens to .76, so the tape stands up enough to
  // be read while the view stays axonometric. Both are measured against the
  // camera's own basis, and the pitch is inside the drag clamp so the pose is
  // still a starting point rather than a wall.
  const REST = { yaw: .35, pitch: .35 };
  const view = { yaw: 0, pitch: 0, vYaw: 0, vPitch: 0 };
  let drag = null;

  canvas.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, y: e.clientY };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag = { x: e.clientX, y: e.clientY };
    view.yaw += dx * .008;
    view.pitch = Math.max(-.6, Math.min(.6, view.pitch + dy * .006));
    view.vYaw = dx * .008; view.vPitch = dy * .006;
  });
  const endDrag = e => {
    if (!drag) return;
    drag = null;
    canvas.classList.remove('dragging');
    if (canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  // ---- run ----------------------------------------------------------------

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    // the assembly eases toward whatever the transport asked for
    if (T.tw.at < 1) {
      T.tw.at = Math.min(1, T.tw.at + dt / T.tw.dur);
      T.progress = T.tw.from + (T.tw.to - T.tw.from) * easeInOut(T.tw.at);
      applyTechnicalAssembly(T.progress);
      setStatus();
      // The intro hands over to playback the moment the tape is shut, so the
      // first thing the page does is show the machine working rather than
      // waiting to be asked.
      if (T.intro && T.tw.at >= 1) { T.intro = false; T.playing = true; setStatus(); }
    }

    // Reels turn when the tape is shut: playing at one, shuttling at six, and
    // in the shuttle's direction. A spool spinning in an exploded view is a
    // spool with no tape on it, so nothing turns below .985.
    if (!reduce && T.progress > .985) {
      const rate = T.shuttle ? 6.5 * T.shuttle : (T.playing ? 1.15 : 0);
      if (rate) {
        T.reel += dt * rate;
        technicalReels.forEach((reel, i) => { reel.rotation.y = T.reel * (i ? -1 : 1); });
      }
    }

    // The file is only going past while the tape is shut and moving.
    tickStream(dt, T.progress > .985 && (T.playing || T.shuttle !== 0));
    if (T.progress < .02 && stream.log.length) resetStream();

    // Orbit, with a glide after the hand comes off — damped rather than
    // stopped dead, because an object that halts the instant you let go feels
    // like a slider and not a thing.
    if (!drag) {
      view.yaw += view.vYaw; view.pitch += view.vPitch;
      view.pitch = Math.max(-.6, Math.min(.6, view.pitch));
      view.vYaw *= .92; view.vPitch *= .92;
      if (Math.abs(view.vYaw) < 1e-4) view.vYaw = 0;
      if (Math.abs(view.vPitch) < 1e-4) view.vPitch = 0;
    }
    t += dt;
    // While the intro runs, the view eases square on the same curve the
    // assembly is using, so the two read as one movement.
    if (T.intro && T.tw.at < 1 && !drag) {
      // one movement: the assembly closes and the tape turns onto its rest pose
      const k = easeInOut(T.tw.at);
      view.yaw = -.34 + (REST.yaw + .34) * k;
      view.pitch = REST.pitch * k;
    }
    tape.rotation.y = view.yaw + (reduce ? 0 : Math.sin(t * .17) * .035);
    tape.rotation.x = view.pitch;
    // The silhouette lines down the side of each extruded part are chosen
    // against the camera, so they are re-chosen whenever anything turns.
    updateTechnicalSilhouettes();
    // Re-read every frame rather than on resize/scroll alone: the host's
    // own layout can shift this iframe's on-screen offset for reasons that
    // fire neither event — a web font swapping in and rewrapping the copy
    // column, for one — and a stale offset is exactly what throws the grid
    // lock off by a fraction of a cell.
    placeStreamBox();

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  measure();
  resize();
  repaint();
  setStatus();          // the readout is right before anything is pressed

  // The intro. A short beat exploded so the drawing registers as an assembly of
  // parts, then it comes together and starts running — eased at both ends, and
  // skipped entirely for anyone who has asked for less motion, who gets the
  // finished object instead.
  if (reduce) {
    T.progress = T.target = 1;
    view.yaw = REST.yaw; view.pitch = REST.pitch;
    applyTechnicalAssembly(1);
    T.intro = false;
    setStatus();
  } else {
    view.yaw = -.34;                      // it turns square as it closes
    setTimeout(() => { if (T.intro) goTo(1, 2.4); }, 620);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
